url: https://resonantia-earth.github.io/mosaik/

template:
  bootstrap: 5
  bootswatch: darkly
  bslib:
    bg: "#0a0e17"
    fg: "#c8d6e5"
    primary: "#60a5fa"
    code-bg: "#1e293b"

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/resonantia-earth/mosaik

reference:
  - title: "Create mosaik objects"
    contents:
      - mosaik
      - mk_from_terra

  - title: "Simulate patterns (sim_*)"
    desc: "Generate synthetic landscape patterns"
    contents:
      - starts_with("sim_")

  - title: "Modify mosaik objects (mdf_*)"
    desc: "Transform gridded mosaik objects"
    contents:
      - starts_with("mdf_")

  - title: "Measure metrics (msr_*)"
    desc: "Quantify structure at patch, class, and landscape scales"
    contents:
      - starts_with("msr_")

  - title: "Derive combined metrics"
    desc: "Combine measurements via user-defined equations"
    contents:
      - derive

  - title: "Utilities (mk_*)"
    desc: "Access, visualise, and export mosaik objects"
    contents:
      - starts_with("mk_")

  - title: "Operators"
    desc: "Arithmetic, comparison, and indexing"
    contents:
      - has_concept("operators")

articles:
  - title: "Getting started"
    contents:
      - mosaik

  - title: "Metrics explorer"
    contents:
      - metrics-explorer

footer:
  structure:
    left: developed_by
    right: built_with
